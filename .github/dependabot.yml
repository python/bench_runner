version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 14

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      pip:
        patterns: ["*"]
    cooldown:
      default-days: 14

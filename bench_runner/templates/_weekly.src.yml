---
name: _weekly

"on":
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

permissions: {}

jobs:
  # Determine the base commit of the selected commit. The output is passed to
  # the `base` job below. If the data already exists for this commit, it will be
  # skipped.
  determine_head:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.head.outputs.commit }}
    steps:
      - name: Checkout CPython
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: python/cpython
          path: cpython
          ref: main
      - name: Determine head commit
        id: head
        run: |
          cd cpython
          git log -n 1 --format="commit=%H" >> "$GITHUB_OUTPUT"

  pystats:
    uses: ./.github/workflows/_pystats.yml
    permissions:
      contents: write
    needs: determine_head
    with:
      fork: python
      ref: ${{ needs.determine_head.outputs.commit }}
      benchmarks: all
      tier2: false

  pystats-tier2:
    uses: ./.github/workflows/_pystats.yml
    permissions:
      contents: write
    needs: determine_head
    with:
      fork: python
      ref: ${{ needs.determine_head.outputs.commit }}
      benchmarks: all
      tier2: true

  generate:
    uses: ./.github/workflows/_generate.yml
    permissions:
      contents: write
    if: ${{ always() }}
    with:
      force: false
    needs: [pystats, pystats-tier2]

  publish:
    uses: ./.github/workflows/_publish.yml
    permissions:
      contents: read
    if: ${{ always() }}
    needs: [generate]
    secrets:
      BENCHMARK_MIRROR: ${{ secrets.BENCHMARK_MIRROR }}

---
name: _generate

"on":
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate all of the derived data, even if it already exists"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: Do not commit to the repo"
        type: boolean
        default: false

permissions: {}

jobs:
  generate-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout benchmarking
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: main
      - name: Checkout CPython
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: python/cpython
          path: cpython
      - name: Setup system Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - name: Install dependencies from PyPI
        run: python -m pip install -r requirements.txt
      - name: Regenerate derived data
        run: python -m bench_runner generate_results ${{ inputs.force == true && '--force' || '' }}
      - name: Add to repo
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 #v11.1.1
        if: ${{ !inputs.dry_run }}
        with:
          add: "['results', 'README.md', 'RESULTS.md', 'longitudinal.svg', 'longitudinal.json', 'configs.svg', 'configs.json', 'memory_long.svg', 'memory_long.json', 'memory_configs.svg', 'memory_configs.json']"
          message: Benchmarking results for @${{ github.actor }}

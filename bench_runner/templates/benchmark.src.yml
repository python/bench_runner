---
name: benchmark
run-name: benchmarking ${{ inputs.fork }}/${{ inputs.ref }} on ${{ inputs.machine }}

"on":
  workflow_dispatch:
    inputs:
      fork:
        description: "Fork of cpython to benchmark"
        default: "python"
      ref:
        description: "Branch, tag or (full) SHA commit to benchmark"
        default: "main"
      machine:
        description: "Machine to run on"
        default: "linux-amd64"
        type: choice
        options:
          - linux-amd64
          - windows-amd64
          - darwin-arm64
          - all
      benchmarks:
        description: "Benchmarks to run (comma-separated; empty runs all benchmarks)"
        type: string
      benchmark_base:
        description: "Also benchmark the base of this commit"
        type: boolean
        default: false
      pystats:
        description: "Also collect pystats for this commit"
        type: boolean
        default: false

permissions: {}

jobs:
  # Determine the base commit of the selected commit. The output is passed to
  # the `base` job below. If the data already exists for this commit, it will be
  # skipped.
  determine_base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head: ${{ steps.base.outputs.head }}
      date: ${{ steps.base.outputs.date }}
      version: ${{ steps.base.outputs.version }}
      ref: ${{ steps.base.outputs.ref }}
      need_to_run: ${{ steps.base.outputs.need_to_run }}
    steps:
      - name: Checkout benchmarking
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup system Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - name: Checkout CPython
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.fork }}/cpython
          path: cpython
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Install dependencies from PyPI
        run: |
          pip install -r requirements.txt
      - name: Determine base
        id: base
        env:
          BENCHMARK_BASE: ${{ inputs.benchmark_base }}
          MACHINE: ${{ inputs.machine }}
          PYSTATS: ${{ inputs.pystats }}
          FLAGS: ${{ env.flags }}
        run: |
          python -m bench_runner get_merge_base "$BENCHMARK_BASE" "$MACHINE" "$PYSTATS" "$FLAGS" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  head:
    uses: ./.github/workflows/_benchmark.yml
    permissions:
      contents: write
    with:
      fork: ${{ inputs.fork }}
      ref: ${{ inputs.ref }}
      machine: ${{ inputs.machine }}
      benchmarks: ${{ inputs.benchmarks }}
      pgo: true
      perf: false
      force: true

  base:
    uses: ./.github/workflows/_benchmark.yml
    permissions:
      contents: write
    needs: determine_base
    if: ${{ needs.determine_base.outputs.need_to_run != 'false' }}
    with:
      fork: python
      ref: ${{ needs.determine_base.outputs.ref }}
      machine: ${{ inputs.machine }}
      benchmarks: ${{ inputs.benchmarks }}
      pgo: true
      perf: false
      force: false

  pystats-head:
    uses: ./.github/workflows/_pystats.yml
    permissions:
      contents: write
    if: ${{ inputs.pystats }}
    with:
      fork: ${{ inputs.fork }}
      ref: ${{ inputs.ref }}
      benchmarks: ${{ inputs.benchmarks }}
      force: true

  pystats-base:
    uses: ./.github/workflows/_pystats.yml
    permissions:
      contents: write
    needs: determine_base
    if: ${{ inputs.pystats && needs.determine_base.outputs.need_to_run != 'false' }}
    with:
      fork: python
      ref: ${{ needs.determine_base.outputs.ref }}
      benchmarks: ${{ inputs.benchmarks }}
      force: false

  generate:
    uses: ./.github/workflows/_generate.yml
    permissions:
      contents: write
    with:
      force: false
    if: ${{ always() }}
    needs: [head, base, pystats-head, pystats-base]

  publish:
    uses: ./.github/workflows/_publish.yml
    permissions:
      contents: read
    if: ${{ always() }}
    needs: [generate]
    secrets:
      BENCHMARK_MIRROR: ${{ secrets.BENCHMARK_MIRROR }}

  notify:
    uses: ./.github/workflows/_notify.yml
    permissions:
      actions: read
      contents: read
      issues: write
    if: ${{ always() }}
    needs: [publish, determine_base]
    with:
      fork: ${{ inputs.fork }}
      ref: ${{ inputs.ref }}
      head: ${{ needs.determine_base.outputs.head }}
      date: ${{ needs.determine_base.outputs.date }}
      version: ${{ needs.determine_base.outputs.version }}
